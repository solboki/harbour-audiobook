# Construit le paquet pour les trois architectures de Sailfish OS a chaque
# envoi de code (paquets disponibles dans les « artifacts » de l'execution).
# Une nouvelle version sur main, ou une etiquette « v* », est publiee en
# Release avec les trois paquets.
name: Build RPM

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, armv7hl, i486]
    steps:
      - uses: actions/checkout@v4

      # Python 3.11, comme Sailfish OS 5 : pip ne telecharge que les versions
      # compatibles avec l'interpreteur qui l'execute.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q rpm qttools5-dev-tools

      - name: Set up QEMU (32-bit ARM emulation)
        if: matrix.arch == 'armv7hl'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Build PyCryptodome for ${{ matrix.arch }}
        if: matrix.arch != 'aarch64'
        run: |
          wheel=$(sh tools/build-crypto.sh ${{ matrix.arch }} build-crypto)
          echo "CRYPTO_WHEEL=$wheel" >> "$GITHUB_ENV"

      - name: Bundle the Python modules
        run: sh tools/vendor.sh ${{ matrix.arch }}

      - name: Build the RPM
        run: sh tools/build-rpm.sh ${{ matrix.arch }} dist

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: dist/*.rpm

  # Publication : sur une etiquette v*, ou sur main des que la version du
  # paquet (champ Version du fichier .spec) n'a pas encore d'etiquette. Dans
  # ce second cas, l'etiquette v<version> est creee avec la Release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide the release tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(sed -n 's/^Version: *//p' harbour-audiobook.spec)
          echo "name=v$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version already released"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.tag.outputs.publish == 'true'
        with:
          pattern: rpm-*
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.publish == 'true'
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Audiobook ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: dist/*.rpm
          body_path: RELEASE.md
